---
name: "Lint pull request title with conventional commits format"

on:  # yamllint disable-line rule:truthy
  # Trigger the workflow on pull request events
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  lint-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:

      - name: Check PR title convention
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
          scopes: |
            ci
            core
            api
            service
            ui
            database
            config
            security
            auth
            logging
            metrics
            deps
            deps-dev
