StylesPath = .vale/styles

MinAlertLevel = warning

Packages = Google, proselint

Vocab = IDP

[*.md]
BasedOnStyles = Vale, Google, proselint
Google.Acronyms = NO
Google.Headings = NO
Google.We = NO
Vale.Terms = NO
Google.Will = NO
# Straight quotes are used in prose and required by Markdown tab syntax.
proselint.CurlyQuotes = NO

[CODE_OF_CONDUCT.md]
# Preserve the wording of the adopted Contributor Covenant.
proselint.Commercialese = NO
