---

services:
  postgres:
    image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: idpcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idpcore_password}
    ports:
      - "5437:5432"
    volumes:
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idpcore -d idpcore"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
