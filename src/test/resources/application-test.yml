---
spring:
  flyway:
    default-schema: idp_core
    enabled: true
    locations: classpath:db/migration, classpath:db/test
  jpa:
    hibernate:
      ddl-auto: none  # Disable JPA schema auto-generation, use Flyway instead
  jackson:
    property-naming-strategy: SNAKE_CASE
    write_dates_as_timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      client:
        registration:
          idp-core:
            client-id: clientIdIdpCore
            client-secret: clientSecretIdpCore
        provider:
          idp-core:
            token-uri: fakeTokenUri
      resourceserver:
        jwt:
          jwk-set-uri: fakeJwkUri

# Added App Security configuration
app:
  security:
    roles:
      baseline-role: "*"
    authentication:
      jwt:
        enabled: true
      api-key:
        enabled: false
      mock:
        enabled: false
      user-claim-mappings:
        sub: "sub"
        preferred_username: "preferred_username"
      service-account-detection:
        enabled: true
        mode: "legacy"
        legacy-fallback-claims: "grant_type,service_name,client_id"
      # ✅ Un-indented: Now properly binds to app.security.authentication.jit-provisioning-excluded-paths
      jit-provisioning-excluded-paths: "/,/actuator/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**"
  ingestion:
    webhook:
      base-path: /webhooks
      identifier-path: /{webhookIdentifier}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
            - db
        readiness:
          include:
            - readinessState
            - db
      show-details: when_authorized
