---
spring:
  flyway:
    default-schema: idp_core
    enabled: true
    locations: classpath:db/migration, classpath:db/test
  jpa:
    hibernate:
      ddl-auto: none  # Disable JPA schema auto-generation, use Flyway instead
  jackson:
    property-naming-strategy: SNAKE_CASE
    write_dates_as_timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      client:
        registration:
          idp-core:
            client-id: clientIdIdpCore
            client-secret: clientSecretIdpCore
        provider:
          idp-core:
            token-uri: fakeTokenUri
      resourceserver:
        jwt:
          jwk-set-uri: fakeJwkUri

# Added App Security configuration
app:
  security:
    authentication:
      jwt:
        enabled: true
      api-key:
        enabled: false
      mock:
        enabled: false
      user-claim-mappings:
        sub: "sub"
        preferred_username: "preferred_username"
      service-account-detection:
        enabled: true
        mode: "strict"
      # ✅ Un-indented: Now properly binds to app.security.authentication.jit-provisioning-excluded-paths
      jit-provisioning-excluded-paths: "/,/actuator/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**"
  ingestion:
    webhook:
      base-path: /webhooks
      identifier-path: /{webhookIdentifier}
      test-security:
        token-env-key: WEBHOOK_TOKEN
        token-env-value: test-static-token-value
        basic-auth-env-key: BASIC_PASS
        basic-auth-env-value: test-basic-password
        hmac-env-key: GITHUB_SECRET
        hmac-env-value: test-github-secret
        jwks-env-key: JWKS_URI
        jwks-env-value: https://auth.example.com/.well-known/jwks.json
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
            - db
        readiness:
          include:
            - readinessState
            - db
      show-details: when_authorized

idp:
  security:
    webhook:
      # Comma-separated allow-list for trusted JWKS hosts.
      # Example: ALLOWED_JWKS_HOSTS=github.com,auth.decathlon.com
      allowed-jwks-hosts: github.com,www.googleapis.com
