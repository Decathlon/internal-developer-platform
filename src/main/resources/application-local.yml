---
server:
  port: 8084
spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/idpcore
    username: idpcore
    password: idpcore_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      schema: idp_core
  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/local
    create-schemas: true
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none # Disable JPA schema auto-generation, use Flyway instead
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
app:
  full-refresh-at-startup: true
  # The base URL of the IDP Core service. GitHub must allow the callback
  # ${app.idp-core-prefix-url}/login/oauth2/code/github in the OAuth app settings.
  idp-core-prefix-url: http://localhost:8084
  security:
    authentication:
      jwt:
        enabled: false
      oauth2-login:
        enabled: true
      mock:
        enabled: false
      user-claim-mappings:
        sub: id
        preferred_username: login
        name: name
        email: email
logging:
  level:
    # Application log level, defaults to INFO. Override per environment via LOG_LEVEL env var.
    com.decathlon: ${LOG_LEVEL:DEBUG}
    # Suppresses noisy Spring context startup logs at WARN level.
    org.springframework.context.support: WARN
    # Suppresses a specific repetitive bean registration delegate log line.
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR
    org.hibernate.SQL: WARN
    org.hibernate.stat: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
